services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hot-monitor-app
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: hot-monitor-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
